# DO NOT EDIT THIS FILE BY HAND - IT WILL BE OVERWRITTEN BY OSUNY

baseURL: https://climb-world.demo.nodc.osuny.site

## OSUNY
osuny:
  website:
    id: fe28ecd8-05c6-4e11-b530-32dc7af93530


## LANGUAGE
defaultContentLanguage: fr
defaultContentLanguageInSubdir: false

## CACHE
deployment:
  matchers:
    - pattern: "^.+\\.(woff2|woff|svg|ttf|otf|eot|js|css)$"
      cacheControl: "max-age=31536000, no-transform, public"
      gzip: true
    - pattern: "^.+\\.(png|jpg|jpeg|gif|webp)$"
      cacheControl: "max-age=31536000, no-transform, public"
      gzip: false
  ## NODC
  targets:
    - name: "production"
      URL: "s3://climb-world.demo.nodc.osuny.site?endpoint=https://s3.nodc.eu&awssdk=v2&use_path_style=true&region=garage&disable_https=false"
